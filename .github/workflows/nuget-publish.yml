name: NuGet Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Pack and push to nuget.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Map tag to project
        id: map
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG##*@}"
          LOWER=$(echo "$TAG" | sed 's|^@neolution-ch/||' | sed 's|@[^@]*$||')

          case "$LOWER" in
            neolution.extensions.caching.abstractions) PROJ="Neolution.Extensions.Caching.Abstractions" ;;
            neolution.extensions.caching.distributed)  PROJ="Neolution.Extensions.Caching.Distributed"  ;;
            neolution.extensions.caching.inmemory)     PROJ="Neolution.Extensions.Caching.InMemory"     ;;
            neolution.extensions.caching.redishybrid)  PROJ="Neolution.Extensions.Caching.RedisHybrid"  ;;
            *)
              echo "Tag '$TAG' does not match a known package. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"

      - name: Remove package.json files from pack input
        if: steps.map.outputs.skip != 'true'
        shell: bash
        run: find . -name package.json -not -path "./node_modules/*" -delete

      - name: Restore
        if: steps.map.outputs.skip != 'true'
        run: dotnet restore ${{ steps.map.outputs.project }}/${{ steps.map.outputs.project }}.csproj

      - name: Pack
        if: steps.map.outputs.skip != 'true'
        run: |
          dotnet pack ${{ steps.map.outputs.project }}/${{ steps.map.outputs.project }}.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.map.outputs.version }} \
            -p:PackageVersion=${{ steps.map.outputs.version }} \
            -o ./nupkgs

      - name: Push
        if: steps.map.outputs.skip != 'true'
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY_NEOLUTION }} \
            --skip-duplicate
